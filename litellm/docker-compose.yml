services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    env_file:
      - .env
    command: ["--config","/app/config.yaml"]
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
