model_list:
  # Primary: Groq (Llama-3.3-70b) - Fast and free tier
  - model_name: coding
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # Fallback: OpenRouter (Qwen3-Coder)
  - model_name: coding-fallback
    litellm_params:
      model: openrouter/qwen/qwen3-coder
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  fallbacks:
    - {"coding": ["coding-fallback"]}
  set_verbose: true

litellm_settings:
  num_retries: 2
  request_timeout: 60
